name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: lint, typecheck, test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: paykeeper
          POSTGRES_PASSWORD: paykeeper
          POSTGRES_DB: paykeeper
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U paykeeper"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PAYKEEPER_WEBHOOK_SECRET: ci-secret
      PAYKEEPER_TEST_DATABASE_URL: postgresql+asyncpg://paykeeper:paykeeper@localhost:5432/paykeeper
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "0.5.14"
          enable-cache: true

      - name: Pin Python
        run: uv python install 3.12

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Lint
        run: |
          uv run ruff check src tests
          uv run ruff format --check src tests

      - name: Typecheck
        run: uv run mypy src

      - name: Run migrations
        env:
          PAYKEEPER_DATABASE_URL: ${{ env.PAYKEEPER_TEST_DATABASE_URL }}
        run: uv run alembic upgrade head

      - name: Run tests with coverage
        run: |
          uv run pytest \
            --cov=paykeeper \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-fail-under=85

      - name: Enforce 100% coverage on critical modules
        run: |
          uv run coverage report \
            --include='src/paykeeper/idempotency/*,src/paykeeper/domain/service.py' \
            --fail-under=100

      - name: Upload coverage xml
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml

  docker:
    name: docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          push: false
          tags: paykeeper:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
